<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Backtest | Backtest Mechanic</title><style>
body{margin:0;background:#0b1627;color:#eaf1fc;font:15px system-ui,Arial}main{max-width:950px;margin:30px auto;padding:24px}h1{margin-bottom:5px}.muted{color:#9bb0c9}.panel{background:#14243a;border:1px solid #2b4869;border-radius:12px;padding:18px;margin:16px 0}button{padding:10px 16px;background:#247bc2;border:0;color:white;border-radius:7px;cursor:pointer;margin:4px}pre{white-space:pre-wrap;word-break:break-word;background:#081322;padding:14px;border-radius:8px;max-height:360px;overflow:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:12px;background:#091a30;border-radius:8px}.stat strong{display:block;font-size:20px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #345;padding:7px;text-align:left}
</style></head><body><main><h1>Backtest Mechanic · Shared Results</h1><p class="muted">Read-only historical simulation. No live broker connection.</p><div id="status" class="panel">Loading shared results…</div><div id="report" hidden><section class="panel"><h2 id="heading"></h2><p id="period" class="muted"></p><div id="metrics" class="stats"></div></section><section class="panel"><h2>Strategy vs. Buy &amp; Hold</h2><div id="benchmark" class="stats"></div></section><section class="panel"><h2>Strategy JSON</h2><button id="copy">Copy Strategy JSON</button><button id="download">Download JSON</button><pre id="json"></pre></section><section class="panel"><h2>Trade evidence</h2><div id="trades"></div></section><section class="panel"><h2>Analytics</h2><pre id="analytics"></pre></section></div></main><script>
(async function(){
const $=id=>document.getElementById(id);const status=$('status');
try {
const fragment=location.hash.slice(1);if(!fragment)throw Error('No backtest snapshot in this link.');
const raw=atob(fragment.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-fragment.length%4)%4));
const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
if(!('DecompressionStream' in window))throw Error('This browser does not support compressed share links.');
const json=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
const d=JSON.parse(json);if(d.schema!=='backtest-mechanic.share.v1')throw Error('Unrecognized share format.');
$('heading').textContent=[d.symbol,d.timeframe].filter(Boolean).join(' · ')||'Backtest results';
$('period').textContent=typeof d.test_period==='string'?d.test_period:JSON.stringify(d.test_period||'');
function addStats(parent,data){if(!data||typeof data!=='object')return;for(const [k,v] of Object.entries(data)){if(v===null||typeof v==='object')continue;const box=document.createElement('div');box.className='stat';const key=document.createElement('span');key.textContent=k.replace(/_/g,' ');const val=document.createElement('strong');val.textContent=String(v);box.append(key,val);parent.append(box)}}
addStats($('metrics'),d.results);addStats($('benchmark'),d.buy_hold);
const strategy=typeof d.strategy==='string'?d.strategy:JSON.stringify(d.strategy||{},null,2);
$('json').textContent=strategy;
$('copy').onclick=()=>navigator.clipboard.writeText(strategy).then(()=>{$('copy').textContent='Copied!'}).catch(()=>alert('Select and copy the JSON below.'));
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([strategy],{type:'application/json'}));a.download='BacktestMechanic_Strategy.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const trades=d.trades||[];if(trades.length){const table=document.createElement('table');const header=document.createElement('tr');['Entry','Exit','P&L'].forEach(x=>{const th=document.createElement('th');th.textContent=x;header.append(th)});table.append(header);trades.forEach(t=>{const row=document.createElement('tr');[t.entry_timestamp,t.exit_timestamp,t.pnl].forEach(v=>{const td=document.createElement('td');td.textContent=v==null?'':String(v);row.append(td)});table.append(row)});$('trades').append(table)}else $('trades').textContent='No trade-level data included in this snapshot.';
$('analytics').textContent=JSON.stringify(d.analytics||{},null,2);$('report').hidden=false;status.hidden=true;
}catch(e){status.textContent='Unable to open this share link: '+e.message}
})();
</script></body></html>
